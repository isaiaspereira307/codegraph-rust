# CodeGraph example configuration.
#
# Copy to ./.codegraph.toml (project) or ~/.codegraph/config.toml (user). The project file
# is used when present; otherwise the user file. A .env file and CODEGRAPH_* environment
# variables override anything set here.
#
# Unknown sections and keys are ignored without an error, so check spelling. Sections from
# older releases ([embedding], [rerank], most of [llm]) are accepted and have no effect.

[indexing]
tier = "fast"                          # fast | balanced | full

[daemon]
auto_start_with_mcp = true             # start the file watcher with `codegraph start --watch`
debounce_ms = 30
batch_timeout_ms = 200
exclude_patterns = ["**/node_modules/**", "**/target/**", "**/.git/**", "**/dist/**"]
# languages = ["rust", "typescript"]

# Size limits of graph tool results follow the client's context window.
# CODEGRAPH_CONTEXT_WINDOW overrides this key.
# [llm]
# context_window = 128000

# Storage has no section here: each project uses <project>/.code-review-graph/graph.db
# (the code-review-graph v15 schema).
