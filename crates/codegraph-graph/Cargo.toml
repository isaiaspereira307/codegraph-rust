[package]
name = "codegraph-graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Graph data structures and operations for CodeGraph"

[dependencies]
codegraph-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
dashmap = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }

# SQLite store (code-review-graph v15 schema)
rusqlite = { workspace = true, optional = true }
petgraph = { workspace = true, optional = true }

tokio = { workspace = true, optional = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:petgraph", "dep:tokio"]

[dev-dependencies]
tempfile = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
