[package]
name = "codegraph-mcp-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Solita CodeGraph"]
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = ["daemon"]
server-http = ["dep:axum", "dep:hyper", "dep:tower", "dep:http-body-util", "dep:tokio-util"]
daemon = ["dep:codegraph-mcp-daemon"]
# Full features for cargo install --features full
full = ["daemon", "server-http"]

[dependencies]
codegraph-mcp-core = { path = "../codegraph-mcp-core" }
codegraph-mcp-tools = { path = "../codegraph-mcp-tools" }
codegraph-mcp-daemon = { path = "../codegraph-mcp-daemon", optional = true }
codegraph-core = { path = "../codegraph-core" }
codegraph-graph = { path = "../codegraph-graph" }
rmcp = { workspace = true }
futures = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
http-body-util = { version = "0.1.5", optional = true }
tokio-util = { version = "0.7.19", optional = true }
colored = { workspace = true }
indicatif = { workspace = true }
atty = { workspace = true }
chrono = { workspace = true }
tracing-subscriber = { workspace = true }
serde_yaml = "0.9.34"
anyhow = { workspace = true }
codegraph-mcp = { path = "../codegraph-mcp" }
tracing-appender = { workspace = true }
dirs = "7.0.0"
dotenv = "0.15.0"
nix = { version = "0.31.3", features = ["process", "signal"] }

[dev-dependencies]
tokenizers = { workspace = true }
serial_test = "4.0.1"
tempfile = { workspace = true }
