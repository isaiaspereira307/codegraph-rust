# ABOUTME: Dogfood workflow running the local composite Action on pull requests.
# ABOUTME: Disabled until a release exists; set repository variable CODEGRAPH_DOGFOOD=true to enable.
name: PR Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ vars.CODEGRAPH_DOGFOOD == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
