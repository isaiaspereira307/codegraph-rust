name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release (default: dry run, build only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#v}"
          else
            # dry run: use the workspace version from Cargo.toml
            version="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version[ \t]*=/{sub(/^version[ \t]*=[ \t]*"/,""); sub(/".*/,""); print; exit}' Cargo.toml)"
          fi
          if [ -z "$version" ]; then
            echo "could not determine version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: cargo build --release --locked -p codegraph-mcp-server --bin codegraph --all-features --target ${{ matrix.target }}

      - name: Verify version
        shell: bash
        env:
          EXPECTED: ${{ steps.version.outputs.version }}
          BIN_DIR: target/${{ matrix.target }}/release
        run: |
          bin="$BIN_DIR/codegraph"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          actual="$("$bin" --version)"
          echo "codegraph --version: $actual"
          if [ "$actual" != "codegraph $EXPECTED" ]; then
            echo "version mismatch: expected 'codegraph $EXPECTED'" >&2
            exit 1
          fi

      - name: Smoke test
        shell: bash
        env:
          BIN_DIR: target/${{ matrix.target }}/release
        run: |
          bin="$PWD/$BIN_DIR/codegraph"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          work="$(mktemp -d)"
          cd "$work"
          git init -q .
          printf 'fn main() {\n    println!("hello");\n}\n' > main.rs
          "$bin" build .
          "$bin" graph-status

      - name: Check no libssl dependency
        if: runner.os == 'Linux'
        env:
          BIN_DIR: target/${{ matrix.target }}/release
        run: |
          if ldd "$BIN_DIR/codegraph" | grep -i libssl; then
            echo "binary links libssl dynamically" >&2
            exit 1
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ matrix.target }}
          BIN_DIR: target/${{ matrix.target }}/release
        run: |
          bin="$BIN_DIR/codegraph"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          bash scripts/release/package.sh "$VERSION" "$TARGET" "$bin" dist

      - uses: actions/upload-artifact@v4
        with:
          name: codegraph-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: codegraph-*
          path: dist
          merge-multiple: true

      - name: Resolve tag
        id: tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            version="$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version[ \t]*=/{sub(/^version[ \t]*=[ \t]*"/,""); sub(/".*/,""); print; exit}' Cargo.toml)"
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create SHA256SUMS
        run: |
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          awk -v ver="$version" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            prev="$(git describe --tags --abbrev=0 --match 'v*' "${TAG}^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then
              range="$prev..$TAG"
            else
              range="$TAG"
            fi
            git log --no-merges --pretty='- %s (%h)' "$range" > notes.md 2>/dev/null \
              || git log --no-merges --pretty='- %s (%h)' -n 50 > notes.md
          fi
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md dist/*

  homebrew:
    name: Update Homebrew tap
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Check tap token
        id: token
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping Homebrew formula update"
          fi

      - name: Render formula
        if: steps.token.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          bash scripts/release/render-formula.sh "${TAG#v}" "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/codegraph.rb"
          cat "$RUNNER_TEMP/codegraph.rb"

      - name: Push formula to tap
        if: steps.token.outputs.enabled == 'true'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          auth="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          git "${git_auth[@]}" clone --depth 1 https://github.com/isaiaspereira307/homebrew-codegraph.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          mkdir -p Formula
          cp "$RUNNER_TEMP/codegraph.rb" Formula/codegraph.rb
          if [ -z "$(git status --porcelain Formula/codegraph.rb)" ]; then
            echo "formula unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/codegraph.rb
          git commit -m "codegraph ${TAG#v}"
          git "${git_auth[@]}" push origin HEAD
